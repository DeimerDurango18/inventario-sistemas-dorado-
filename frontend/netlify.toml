# Configuración de despliegue para Netlify
# El frontend es un build estático de React/Vite que se conecta a tu API FastAPI.
#
# Variable de entorno requerida en Netlify (Build > Environment variables):
#   VITE_API_URL = https://tu-api.com   (URL pública de tu backend FastAPI)
#
# Tu sitio Netlify: https://durango-dev.netlify.app
# Vite la inyecta en tiempo de build (import.meta.env.VITE_API_URL).

[build]
  # El código del frontend está en la carpeta /frontend
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build"

# No hay router en la SPA (navegación por estado), pero dejamos un redirect
# catch-all por si en el futuro el frontend use rutas (evita 404 al recargar).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad básicas recomendadas para la SPA.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
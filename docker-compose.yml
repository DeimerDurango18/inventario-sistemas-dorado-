services:
  backend:
    build:
      context: ./backend
    container_name: inventario-backend
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "1433"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: inventario-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend
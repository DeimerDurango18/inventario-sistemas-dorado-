services:
  backend:
    build:
      context: ./backend
    container_name: inventario-backend
    ports:
      - "8500:8500"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "1433"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: inventario-frontend
    ports:
      - "4123:4123"
    restart: unless-stopped
    depends_on:
      - backend